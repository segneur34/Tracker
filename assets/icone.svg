<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icône de Tracker, version simplifiée du logo (assets/logo.png) pour les petites tailles :
       côte entre terre et mer, sentier de course, bords de voile, rose des vents. -->
  <defs>
    <clipPath id="disque"><circle cx="512" cy="512" r="500"/></clipPath>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c6fa6"/>
      <stop offset="1" stop-color="#1c3572"/>
    </linearGradient>
    <linearGradient id="sentier" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c7305c"/>
      <stop offset="0.5" stop-color="#f2762b"/>
      <stop offset="1" stop-color="#ffc93a"/>
    </linearGradient>
    <linearGradient id="bords" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5cc8"/>
      <stop offset="1" stop-color="#3aa6f0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#disque)">
    <rect width="1024" height="1024" fill="url(#mer)"/>
    <path d="M0 0 H600 C560 150 610 260 540 380 C490 460 470 540 520 610 C560 680 470 800 390 1024 H0 Z" fill="#2e6a3b"/>
    <path d="M600 0 C560 150 610 260 540 380 C490 460 470 540 520 610 C560 680 470 800 390 1024" fill="none" stroke="#f4f1ea" stroke-width="16"/>
    <path d="M470 0 C430 150 480 260 410 380 C360 460 340 540 390 610 C430 680 340 800 260 1024" fill="none" stroke="#3f8150" stroke-width="12"/>
    <path d="M330 0 C290 150 340 260 270 380 C220 460 200 540 250 610 C290 680 200 800 120 1024" fill="none" stroke="#3f8150" stroke-width="12"/>
    <!-- Sentier -->
    <path d="M90 830 C180 840 200 740 250 720 C300 700 340 760 370 700 C400 640 300 610 330 560 C360 510 450 560 460 490 C470 420 380 410 410 350 C430 310 480 320 490 260" fill="none" stroke="#5e1420" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 830 C180 840 200 740 250 720 C300 700 340 760 370 700 C400 640 300 610 330 560 C360 510 450 560 460 490 C470 420 380 410 410 350 C430 310 480 320 490 260" fill="none" stroke="url(#sentier)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bords -->
    <path d="M540 560 L810 500 L620 680 L820 790 L640 900" fill="none" stroke="#231d5c" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M540 560 L810 500 L620 680 L820 790 L640 900" fill="none" stroke="url(#bords)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="810" cy="500" r="30" fill="#ffffff" stroke="#231d5c" stroke-width="10"/>
    <circle cx="640" cy="900" r="30" fill="#3aa6f0" stroke="#231d5c" stroke-width="10"/>
    <!-- Rose des vents -->
    <circle cx="770" cy="250" r="170" fill="url(#halo)"/>
    <path d="M770 120 L800 220 L900 250 L800 280 L770 380 L740 280 L640 250 L740 220 Z" fill="#1d2744"/>
    <path d="M770 120 L800 220 L770 250 Z M900 250 L800 280 L770 250 Z M770 380 L740 280 L770 250 Z M640 250 L740 220 L770 250 Z" fill="#c9d3e6"/>
  </g>
  <circle cx="512" cy="512" r="494" fill="none" stroke="#1d4428" stroke-width="20"/>
  <circle cx="512" cy="512" r="474" fill="none" stroke="#f4f1ea" stroke-width="8"/>
</svg>
