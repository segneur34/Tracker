# Vérification à chaque envoi vers main (dépôt privé : les minutes comptent, pas de déclenchement par branche).
name: verif

on:
  push:
    branches: [main]

jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint sans avertissement toléré, tous les tests en ordre mélangé (graine tirée à chaque passage), build,
      # renvois des documents.
      - run: npm run verif
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Le projet Android s'ouvre : bit exécutable de gradlew, JDK 21, wrapper téléchargeable.
      - run: ./gradlew --version
        working-directory: android
      # Test JUnit du format .imu (ImuWriter), que npm run verif ne joue pas. Gradle lit des fichiers que seul
      # cap sync produit (cordova.variables.gradle), et cap sync lit dist, construit par npm run verif.
      - run: npx cap sync android
      - run: ./gradlew testDebugUnitTest
        working-directory: android
