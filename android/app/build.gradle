apply plugin: 'com.android.application'

// Version unique de l'application : celle de package.json. versionCode doit
// croître à chaque APK diffusé, sans quoi Android refuse la mise à jour.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version as String
def versionParts = appVersion.tokenize('.').collect { it.replaceAll(/\D.*$/, '') as int }
// Code croissant tant que le patch reste sous 1000 : 0.3.65 -> 3 065, 0.4.0 -> 4 000.
// L'ancienne formule (x 10000, x 100) donnait un seul code pour 0.3.100 et 0.4.0.
if (versionParts.size() != 3 || versionParts[2] > 999 || versionParts[1] > 999) {
    throw new GradleException("Version ${appVersion} : il faut trois nombres, mineur et patch sous 1000 (versionCode)")
}
def appVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]

// Clé de signature, hors du dépôt : android/keystore.properties (ignoré par git)
// désigne le fichier .jks et son mot de passe. Debug et release sont signés par
// la même clé, pour qu'une version s'installe par-dessus l'autre sans perdre
// les données. Sans ce fichier, le debug retombe sur la clé de debug du PC et
// le release est refusé (`requireReleaseKey`, plus bas) : ni `assembleRelease`
// (l'APK) ni `bundleRelease` (l'AAB qu'exige Google Play) ne sortent sans clé.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "io.github.segneur.tracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.segneur.tracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        tracker {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.tracker
        }
        release {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.tracker
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // L'APK porte la version : Tracker-<version>.apk en release, Tracker-<version>-debug.apk sinon.
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "Tracker-${appVersion}${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk" }
    }
}

// Refus d'un release sans clé, à l'exécution seulement : assembleDebug et la
// synchronisation d'Android Studio ne lancent pas preReleaseBuild, donc pas ceci.
def requireReleaseKey = tasks.register('requireReleaseKey') {
    doLast {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException("Release refusé : ${keystorePropertiesFile} est absent, sans clé de signature il ne serait pas installable (signature et version : docs/ETAT_DU_PROJET.md, §12). assembleDebug reste possible.")
        }
    }
}
// Le plugin Android de Gradle crée preReleaseBuild après la lecture de ce fichier : `matching`, pas `named`.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { task -> task.dependsOn requireReleaseKey }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
